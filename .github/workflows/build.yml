name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter project and add our code
        run: |
          flutter create --org com.dietdesk --project-name dietdesk --platforms=android .
          flutter pub add shared_preferences http package_info_plus url_launcher
          cp dietdesk/src/*.dart lib/
          sed -i "s#OWNER/REPO#${{ github.repository }}#" lib/update_checker.dart
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DietDesk build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
