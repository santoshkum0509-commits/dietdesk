name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.KEYSTORE_B64 }}
      KP: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter project and add our code
        run: |
          flutter create --org com.dietdesk --project-name dietdesk --platforms=android .
          flutter pub add shared_preferences http package_info_plus url_launcher
          cp dietdesk/src/*.dart lib/
          sed -i "s#OWNER/REPO#${{ github.repository }}#" lib/update_checker.dart
          sed -i 's/android:label="[^"]*"/android:label="DietDesk"/' android/app/src/main/AndroidManifest.xml
      - name: App icon
        continue-on-error: true
        run: |
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; px=${pair##*:}
            convert -size ${px}x${px} xc:none \
              -fill '#00897B' -draw "roundrectangle 0,0 $((px-1)),$((px-1)) $((px/5)),$((px/5))" \
              -fill white -draw "circle $((px/2)),$((px/2)) $((px/2)),$((px/2-px*28/100))" \
              -fill '#00897B' -draw "circle $((px/2)),$((px/2)) $((px/2)),$((px/2-px*14/100))" \
              android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Sign APK with permanent key
        if: env.KS != ''
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          echo "$KS" | base64 -d > $RUNNER_TEMP/release.jks
          $APKSIGNER sign --ks $RUNNER_TEMP/release.jks --ks-key-alias release --ks-pass env:KP --key-pass env:KP build/app/outputs/flutter-apk/app-release.apk
          $APKSIGNER verify build/app/outputs/flutter-apk/app-release.apk && echo "signed OK"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DietDesk build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
